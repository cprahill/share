<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/share/mars/">
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RED DUST BAJA BUILD 81</title>
<link rel="stylesheet" href="hud.css?v=13" />
<script>
(function () {
  var coarse = false, noHover = false;
  try {
    coarse = matchMedia("(pointer: coarse)").matches;
    noHover = matchMedia("(hover: none)").matches;
  } catch (e) {}
  var t = ("ontouchstart" in window) || ((navigator.maxTouchPoints || 0) > 0);
  if (coarse || noHover || t) document.documentElement.classList.add("touch-on");
})();
</script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.167.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.167.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
<div id="build-chip">BUILD 81</div>
<div class="glass" id="timer-panel"><span class="label">TIME</span><span id="timer-val">00:00.000</span></div>
<div id="gate-panel">
<div class="gate-line">GATE <span id="gate-idx">1/5</span></div>
<div id="gate-dist">0 m</div>
</div>
<div class="glass" id="place-panel"><span class="label">PLACE</span><span id="place-val">2nd</span></div>
<div id="chevron"></div>
<div class="glass" id="speed-cluster">
  <div id="boost-tank" aria-hidden="true"><i id="boost-fill"></i></div>
  <div class="speed-wrap">
    <span class="unit">MPH</span>
    <span class="speed-num" id="speed-val">0</span>
    <span class="boost-tag">BOOST</span>
  </div>
</div>
<div id="hint">v81  3 LAPS    HOLD GAS    SPACE BOOST    RED TURBOS    R RETRY</div>
<div id="count">3</div>
<div id="finish" class="glass"><div class="label" id="finish-label">YOU WIN</div><div class="val" id="finish-time">00:00.000</div><div class="hint">R TO RACE AGAIN</div></div>
<div id="fail-toast" class="glass">CHECKPOINT</div>
</div>
<div id="touch" aria-hidden="true">
  <div id="steer-well" class="glass pad-hit">
    <div id="steer-knob"></div>
    <span class="steer-label">STEER</span>
  </div>
  <div id="livery-tap" class="pad-hit" aria-label="cycle livery"></div>
  <div id="touch-right">
    <div id="pad-brake" class="glass pad-hit"><span>BRAKE</span></div>
    <div id="pad-boost" class="glass pad-hit"><span>BOOST</span></div>
    <div id="pad-throttle" class="glass pad-hit"><span>GAS</span></div>
  </div>
</div>
<script type="module" src="./game-v81.js"></script>
</body>
</html>
