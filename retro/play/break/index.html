<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/share/retro/play/break/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok Break</title>
  <link rel="stylesheet" href="../shell.css" />
  <style>
    body { background: #07080c; }
    canvas { image-rendering: auto; }
    .over { position: fixed; inset: 0; top: 48px; display: none; place-items: center; background: #07080ccc; z-index: 10; text-align: center; }
    .over.on { display: grid; }
    button { appearance: none; cursor: pointer; background: #e8c470; color: #140e08; border: 0; border-radius: 8px; font: 700 12px/2.4 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; padding: 0 1rem; }
    .hud { position: fixed; left: 1rem; bottom: 1rem; z-index: 8; font: 700 12px/1.4 ui-monospace, monospace; color: #e8c470; pointer-events: none; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">Hall</a>
    <span class="era">Break</span>
    <span class="name">Grok Break</span>
    <span class="hint">Mouse move or ← → · click / Space serve</span>
  </div>
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="over" id="over"><div><h2 id="end">BREAK</h2><p id="sc"></p><button type="button" id="again">Again</button></div></div>
  <script src="../kit.js"></script>
  <script>
    const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
    const sfx = () => (window.RetroKit && RetroKit.sfx) || {};
    const keys = Object.create(null);
    const mouse = { x: 0, live: false, at: 0, click: false };
    addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "KeyA" || e.code === "KeyD") mouse.live = false;
      if (e.code === "Space") e.preventDefault();
    });
    addEventListener("keyup", (e) => { keys[e.code] = false; });
    function mousePos(e) {
      const r = cvs.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) * (W / r.width);
      mouse.live = true;
      mouse.at = performance.now();
    }
    cvs.addEventListener("pointermove", mousePos);
    cvs.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      mousePos(e);
      mouse.click = true;
      cvs.setPointerCapture(e.pointerId);
    });
    addEventListener("pointerup", () => { mouse.click = false; });

    let W, H, dpr;
    function resize() {
      dpr = Math.min(2, devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cvs.width = W * dpr; cvs.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
    }
    addEventListener("resize", resize); resize();

    function loadImg(url, done) {
      const img = new Image();
      img.onload = () => done(img);
      img.src = url;
    }

    const art = { bg: null, paddle: null, ball: null, teal: null, gold: null, copper: null, crimson: null, steel: null, dropWide: null, dropMulti: null, dropLaser: null };
    const bgImg = new Image();
    bgImg.onload = () => { art.bg = bgImg; };
    bgImg.src = "art/bg.jpg";
    loadImg("art/paddle.png", (c) => { art.paddle = c; });
    loadImg("art/ball.png", (c) => { art.ball = c; });
    loadImg("art/brick-teal.png", (c) => { art.teal = c; });
    loadImg("art/brick-gold.png", (c) => { art.gold = c; });
    loadImg("art/brick-copper.png", (c) => { art.copper = c; });
    loadImg("art/brick-crimson.png", (c) => { art.crimson = c; });
    loadImg("art/brick-steel.png", (c) => { art.steel = c; });
    loadImg("art/drop-wide.png", (c) => { art.dropWide = c; });
    loadImg("art/drop-multi.png", (c) => { art.dropMulti = c; });
    loadImg("art/drop-laser.png", (c) => { art.dropLaser = c; });
    const KINDS = ["teal", "gold", "copper", "crimson"];

    function cover() {
      if (!art.bg) return { dx: 0, dy: 0, dw: W, dh: H };
      const ir = art.bg.naturalWidth / art.bg.naturalHeight, wr = W / H;
      let dw, dh, dx, dy;
      if (wr > ir) { dw = W; dh = W / ir; dx = 0; dy = (H - dh) / 2; }
      else { dh = H; dw = H * ir; dx = (W - dw) / 2; dy = 0; }
      return { dx, dy, dw, dh };
    }
    function field() {
      const b = cover();
      return {
        x: b.dx + b.dw * 0.145,
        y: Math.max(56, b.dy + b.dh * 0.11),
        w: b.dw * 0.71,
        h: b.dh * 0.62,
        paddleY: b.dy + b.dh * 0.812,
        r: 4
      };
    }

    const COLS = 14, ROWS = 8;
    let S, parts = [];

    function brickGeom(k) {
      const f = field();
      const gap = Math.max(3, f.w * 0.006);
      const bw = (f.w - gap * COLS) / COLS;
      const bh = bw * 0.42;
      const odd = k.r % 2;
      const cols = odd ? COLS - 1 : COLS;
      const ox = f.x + (odd ? (bw + gap) * 0.5 : 0) + gap * 0.5;
      return { x: ox + k.c * (bw + gap), y: f.y + 6 + k.r * (bh + gap), w: bw, h: bh, cols };
    }
    function layout(n) {
      const bricks = [];
      const pattern = n % 3;
      for (let r = 0; r < ROWS; r++) {
        const cols = r % 2 ? COLS - 1 : COLS;
        for (let c = 0; c < cols; c++) {
          if (pattern === 1 && (c + r) % 2 === 0 && r > 1) continue;
          if (pattern === 2 && r > 2 && r < 6 && c > 4 && c < 9 && !(r === 4 && c === 6)) continue;
          const solid = pattern === 2 && r === 4 && c === 6;
          const kind = solid ? "steel" : KINDS[(r + n + c) % KINDS.length];
          bricks.push({ c, r, hp: solid ? 99 : (r < 2 ? 2 : 1), solid, kind });
        }
      }
      return bricks;
    }
    function spark(x, y, n, col) {
      for (let i = 0; i < n; i++) {
        parts.push({
          x, y,
          vx: (Math.random() - 0.5) * 140,
          vy: (Math.random() - 0.7) * 120,
          life: 0.25 + Math.random() * 0.35,
          col: col || "#ff7a3a"
        });
      }
    }
    function boot() {
      S = {
        px: W / 2, pw: 0, balls: [], bricks: layout(0), lives: 3, score: 0,
        served: false, wave: 0, drops: [], laser: 0, wide: 0, lcool: 0
      };
      document.getElementById("over").className = "over";
    }
    function serve() {
      if (S.served || S.lives <= 0) return;
      S.served = true;
      const f = field();
      const R = Math.max(5, f.w * 0.0074);
      const dir = mouse.live ? Math.sign(mouse.x - S.px) || 1 : (Math.random() < 0.5 ? -1 : 1);
      S.balls = [{ x: S.px, y: f.paddleY - 14, vx: 255 * dir, vy: -410, r: R }];
    }
    boot();

    function hitPaddle(b, f) {
      const half = S.pw / 2;
      const ph = Math.max(16, S.pw * 0.18);
      const top = f.paddleY - ph * 0.35;
      if (b.vy > 0 && b.y + b.r > top && b.y < f.paddleY + ph && b.x > S.px - half - b.r && b.x < S.px + half + b.r) {
        b.y = top - b.r;
        b.vy = -Math.abs(b.vy);
        b.vx += (b.x - S.px) * 6.4;
        const spd = Math.hypot(b.vx, b.vy);
        const cap = 660;
        if (spd > cap) { b.vx *= cap / spd; b.vy *= cap / spd; }
        if (spd < 360) { b.vx *= 360 / spd; b.vy *= 360 / spd; }
        (sfx().tick || (() => {}))();
        return true;
      }
      return false;
    }
    function bounceBrick(b, box) {
      const nx = Math.max(box.x, Math.min(box.x + box.w, b.x));
      const ny = Math.max(box.y, Math.min(box.y + box.h, b.y));
      const dx = b.x - nx, dy = b.y - ny;
      if (Math.abs(dx) > Math.abs(dy)) {
        b.vx = Math.abs(b.vx) * (b.x < box.x + box.w / 2 ? -1 : 1);
        b.x = b.x < box.x + box.w / 2 ? box.x - b.r - 0.5 : box.x + box.w + b.r + 0.5;
      } else {
        b.vy = Math.abs(b.vy) * (b.y < box.y + box.h / 2 ? -1 : 1);
        b.y = b.y < box.y + box.h / 2 ? box.y - b.r - 0.5 : box.y + box.h + b.r + 0.5;
      }
    }

    function tick(dt) {
      if (!S || S.lives <= 0) return;
      const f = field();
      S.wide = Math.max(0, S.wide - dt);
      S.laser = Math.max(0, S.laser - dt);
      S.lcool = Math.max(0, S.lcool - dt);
      S.pw = (S.wide > 0 ? 0.20 : 0.125) * f.w;
      const usingMouse = mouse.live && performance.now() - mouse.at < 480;
      if (usingMouse) S.px = mouse.x;
      else {
        if (keys.ArrowLeft || keys.KeyA) S.px -= 580 * dt;
        if (keys.ArrowRight || keys.KeyD) S.px += 580 * dt;
      }
      S.px = Math.max(f.x + S.pw / 2, Math.min(f.x + f.w - S.pw / 2, S.px));

      const wantServe = keys.Space || mouse.click;
      if (wantServe) {
        keys.Space = false;
        mouse.click = false;
        if (!S.served) serve();
        else if (S.laser > 0 && S.lcool <= 0) {
          S.lcool = 0.15;
          const y0 = f.paddleY - 12;
          S.drops.push({ x: S.px - 11, y: y0, vy: -820, laser: true, h: 72 });
          S.drops.push({ x: S.px + 11, y: y0, vy: -820, laser: true, h: 72 });
          spark(S.px - 11, y0, 5, "#ff6a40");
          spark(S.px + 11, y0, 5, "#ff6a40");
          (sfx().shoot || (() => {}))();
          (sfx().charge || (() => {}))();
        }
      }

      for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt; p.life -= dt; }
      parts = parts.filter((p) => p.life > 0);
      if (Math.random() < 0.35) {
        spark(f.x - 8, f.paddleY - 10, 1, "#ff7a3a");
        spark(f.x + f.w + 8, f.paddleY - 10, 1, "#ff7a3a");
      }

      if (!S.served) {
        S.balls = [{ x: S.px, y: f.paddleY - 14, vx: 0, vy: 0, r: Math.max(5, f.w * 0.0074) }];
        return;
      }

      const spdMul = 1 + S.wave * 0.11;
      for (const b of S.balls) {
        const steps = 2;
        const sdt = dt / steps;
        for (let i = 0; i < steps; i++) {
          b.x += b.vx * sdt * spdMul;
          b.y += b.vy * sdt * spdMul;
          if (b.x - b.r < f.x) { b.x = f.x + b.r; b.vx = Math.abs(b.vx); }
          if (b.x + b.r > f.x + f.w) { b.x = f.x + f.w - b.r; b.vx = -Math.abs(b.vx); }
          if (b.y - b.r < f.y) { b.y = f.y + b.r; b.vy = Math.abs(b.vy); }
          hitPaddle(b, f);
          for (const k of S.bricks) {
            if (k.hp <= 0) continue;
            const box = brickGeom(k);
            const nx = Math.max(box.x, Math.min(box.x + box.w, b.x));
            const ny = Math.max(box.y, Math.min(box.y + box.h, b.y));
            const dx = b.x - nx, dy = b.y - ny;
            if (dx * dx + dy * dy > b.r * b.r) continue;
            bounceBrick(b, box);
            if (k.solid) { (sfx().tick || (() => {}))(); continue; }
            k.hp--; S.score += 10;
            (sfx().brick || (() => {}))();
            spark(b.x, b.y, 8, k.kind === "gold" ? "#e8c470" : k.kind === "crimson" ? "#ff5a4a" : "#3ef0c8");
            if (k.hp <= 0 && Math.random() < 0.16) {
              const kinds = ["wide", "multi", "laser"];
              S.drops.push({ x: box.x + box.w / 2, y: box.y + box.h, vy: 95, kind: kinds[(Math.random() * 3) | 0] });
            }
            break;
          }
        }
      }

      for (const d of S.drops) {
        d.y += (d.vy || 90) * dt;
        if (d.laser) {
          const top = d.y - (d.h || 72), bot = d.y + 6;
          let hit = null;
          for (const k of S.bricks) {
            if (k.hp <= 0 || k.solid) continue;
            const box = brickGeom(k);
            if (d.x >= box.x && d.x <= box.x + box.w && box.y + box.h > top && box.y < bot) {
              if (!hit || box.y + box.h > hit.box.y + hit.box.h) hit = { k, box };
            }
          }
          if (hit) {
            hit.k.hp--; S.score += 10; d.y = -99;
            spark(d.x, hit.box.y + hit.box.h, 12, "#ff6a40");
            spark(d.x, hit.box.y + hit.box.h, 6, "#fff2c8");
            (sfx().brick || (() => {}))();
          }
        } else if (d.y > f.paddleY - 8 && d.y < f.paddleY + 18 && d.x > S.px - S.pw / 2 && d.x < S.px + S.pw / 2) {
          d.y = H + 40;
          if (d.kind === "wide") S.wide = 9;
          if (d.kind === "laser") S.laser = 8;
          if (d.kind === "multi" && S.balls[0]) {
            const b = S.balls[0];
            S.balls.push({ x: b.x, y: b.y, vx: -b.vx, vy: b.vy, r: b.r });
            S.balls.push({ x: b.x, y: b.y, vx: b.vx * 0.7, vy: b.vy, r: b.r });
          }
          (sfx().pickup || (() => {}))();
        }
      }
      S.drops = S.drops.filter((d) => d.y > 40 && d.y < H + 12);
      S.balls = S.balls.filter((b) => b.y < H + 30);
      if (!S.balls.length) {
        S.lives--; S.served = false; S.laser = 0;
        if (S.lives <= 0) {
          (sfx().die || (() => {}))();
          document.getElementById("end").textContent = "WALL STANDS";
          document.getElementById("sc").textContent = S.score + " pts";
          document.getElementById("over").className = "over on";
        }
      }
      if (S.bricks.every((k) => k.hp <= 0 || k.solid)) {
        S.wave++; S.score += 100; S.bricks = layout(S.wave); S.served = false; S.balls = [];
        (sfx().win || (() => {}))();
        if (S.wave >= 6) {
          document.getElementById("end").textContent = "WALLS DOWN";
          document.getElementById("sc").textContent = S.score + " pts";
          document.getElementById("over").className = "over on";
          S.lives = 0;
        }
      }
    }

    function drawSpr(spr, x, y, w, h) {
      if (!spr) return false;
      ctx.drawImage(spr, x, y, w, h);
      return true;
    }
    function draw() {
      ctx.fillStyle = "#07080c"; ctx.fillRect(0, 0, W, H);
      const b = cover();
      if (art.bg) ctx.drawImage(art.bg, b.dx, b.dy, b.dw, b.dh);
      if (!S) return;
      const f = field();
      for (const k of S.bricks) {
        if (k.hp <= 0) continue;
        const box = brickGeom(k);
        const spr = art[k.kind];
        ctx.globalAlpha = k.solid ? 1 : (k.hp === 1 ? 0.78 : 1);
        if (!drawSpr(spr, box.x, box.y, box.w, box.h)) {
          ctx.fillStyle = k.kind === "gold" ? "#e8c470" : k.kind === "copper" ? "#c45c28" : k.kind === "crimson" ? "#ff5a4a" : k.kind === "steel" ? "#4a5560" : "#3ef0c8";
          ctx.beginPath();
          ctx.roundRect(box.x, box.y, box.w, box.h, 4);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      const ph = Math.max(16, S.pw * 0.18);
      const px = S.px - S.pw / 2, py = f.paddleY - ph * 0.35;
      if (!drawSpr(art.paddle, px, py, S.pw, ph)) {
        ctx.fillStyle = "#c4a056";
        ctx.beginPath(); ctx.roundRect(px, py, S.pw, ph, ph / 2); ctx.fill();
        ctx.fillStyle = "#3ef0c8"; ctx.fillRect(px + 10, py + ph * 0.4, S.pw - 20, 4);
      }
      if (S.laser > 0) {
        const pulse = 0.5 + Math.sin(performance.now() / 70) * 0.5;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.35 + pulse * 0.4;
        ctx.fillStyle = "#ff4a32";
        ctx.fillRect(px + 10, py + ph * 0.38, S.pw - 20, 3);
        ctx.beginPath();
        ctx.arc(S.px - 11, py + 2, 3.2 + pulse, 0, 7);
        ctx.arc(S.px + 11, py + 2, 3.2 + pulse, 0, 7);
        ctx.fill();
        ctx.restore();
      }
      for (const ball of S.balls) {
        const s = ball.r * 4.2;
        if (!drawSpr(art.ball, ball.x - s / 2, ball.y - s / 2, s, s)) {
          ctx.fillStyle = "#3ef0c8";
          ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
        }
      }
      for (const d of S.drops) {
        if (d.laser) {
          const h = d.h || 72;
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const g = ctx.createLinearGradient(d.x, d.y, d.x, d.y - h);
          g.addColorStop(0, "rgba(255,90,50,0)");
          g.addColorStop(0.15, "rgba(255,80,40,0.35)");
          g.addColorStop(0.7, "rgba(255,180,90,0.85)");
          g.addColorStop(1, "rgba(255,255,230,1)");
          ctx.fillStyle = "rgba(255,70,40,0.22)";
          ctx.fillRect(d.x - 7, d.y - h, 14, h);
          ctx.fillStyle = g;
          ctx.fillRect(d.x - 2.4, d.y - h, 4.8, h);
          ctx.fillStyle = "#fff6e0";
          ctx.fillRect(d.x - 0.8, d.y - h, 1.6, h);
          ctx.beginPath(); ctx.arc(d.x, d.y - h, 3.4, 0, 7); ctx.fill();
          ctx.restore();
          continue;
        }
        const spr = d.kind === "wide" ? art.dropWide : d.kind === "laser" ? art.dropLaser : art.dropMulti;
        const ar = spr ? (spr.naturalWidth / spr.naturalHeight) : 1;
        let dw, dh;
        if (ar > 1.8) { dw = 54; dh = dw / ar; }
        else { dh = 34; dw = dh * ar; }
        if (!drawSpr(spr, d.x - dw / 2, d.y - dh / 2, dw, dh)) {
          ctx.fillStyle = d.kind === "wide" ? "#e8c470" : d.kind === "laser" ? "#ff5a4a" : "#3ef0c8";
          ctx.beginPath(); ctx.arc(d.x, d.y, 7, 0, 7); ctx.fill();
        }
      }
      for (const p of parts) {
        ctx.globalAlpha = Math.max(0, p.life * 3);
        ctx.fillStyle = p.col;
        ctx.fillRect(p.x, p.y, 2, 2);
      }
      ctx.globalAlpha = 1;
      if (!S.served && S.lives > 0) {
        ctx.fillStyle = "#e8c470cc";
        ctx.font = "700 13px ui-monospace";
        ctx.textAlign = "center";
        ctx.fillText("click or space", f.x + f.w / 2, f.paddleY + 28);
        ctx.textAlign = "left";
      }
      document.getElementById("hud").textContent =
        S.score + " pts   ·   lives " + S.lives + "   ·   wall " + (S.wave + 1) +
        (S.laser > 0 ? "   ·   LASER" : "") + (S.wide > 0 ? "   ·   WIDE" : "");
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      tick(dt); draw(); requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    document.getElementById("again").onclick = boot;
  </script>
</body>
</html>
