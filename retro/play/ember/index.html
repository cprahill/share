<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/share/retro/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ember Drift</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02060c; color: #e8f4f8; font: 15px/1.4 "Avenir Next", system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #ui { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; gap: .7rem; align-items: center; padding: .55rem .9rem; font: 700 11px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
    #ui a { pointer-events: auto; text-decoration: none; background: #5ee0c8; color: #041210; padding: .35rem .6rem; border-radius: 6px; }
    #hud { margin-left: auto; text-shadow: 0 1px 8px #000; }
    #boostbar { position: fixed; right: 1rem; bottom: 1.2rem; width: 7rem; height: 6px; background: #0a1820; border-radius: 99px; overflow: hidden; z-index: 4; display: none; }
    #boostbar i { display: block; height: 100%; width: 0; background: #5ee0c8; }
    #boostbar.on { display: block; }
    #title, #pause { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; display: grid; place-items: center; z-index: 5; background: linear-gradient(180deg, #02060cbb, #02060ce8); text-align: center; padding: 1rem; }
    #pause { display: none; }
    h1 { font-size: clamp(2.1rem, 6vw, 3.4rem); letter-spacing: -.04em; margin: 0 0 .4rem; }
    .sub { color: #8aa8b0; max-width: 30rem; margin: 0 auto 1.2rem; }
    button { appearance: none; cursor: pointer; margin: .25rem; border: 1px solid #245; background: #0a1820cc; color: #e8f4f8; font: 700 13px/2.2 "Avenir Next", system-ui, sans-serif; padding: 0 1.1rem; border-radius: 8px; }
    button:hover, button.on { background: #5ee0c8; color: #041210; border-color: #5ee0c8; }
    .hint { color: #5a7078; font-size: .85rem; margin-top: 1rem; }
    #port { position: fixed; left: 1rem; bottom: 1rem; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; border: 2px solid #5ee0c8; z-index: 4; display: none; box-shadow: 0 0 24px #5ee0c866; }
    #port.on { display: block; }
    #port img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div id="ui"><a href="../../">Hall</a><span>Ember Drift</span><span id="hud"></span></div>
  <div id="port"><img src="art/drake-front.jpg" alt=""></div>
  <div id="boostbar"><i id="boosti"></i></div>
  <div id="title">
    <div>
      <p class="sub" style="letter-spacing:.28em;text-transform:uppercase;font-size:.72rem">Sci-fi · Three.js</p>
      <h1>Ember Drift</h1>
      <p class="sub">You are the dragon. Fly through the glowing rings. Miss one and the lane yanks you back.</p>
      <p class="sub" style="margin-top:-.4rem">WASD or drag to steer. Space or tap to burst. Twelve rings.</p>
      <div>
        <button data-d="easy">Easy</button>
        <button data-d="normal" class="on">Play</button>
        <button data-d="hard">Hard</button>
      </div>
      <p class="hint">Hall stays in the top-left. Esc also leaves.</p>
    </div>
  </div>
  <div id="pause"><div><h1 id="end">Clear</h1><p class="sub" id="endsub"></p><button id="again">Title</button></div></div>
  <script type="module">
    import * as THREE from "./vendor/three.module.js";

    const RING_N = 12;
    const DIFF = {
      easy:   { speed: 16, radius: 2.5, lives: 6, wall: 6.2, hazards: 4 },
      normal: { speed: 22, radius: 1.9, lives: 4, wall: 5.6, hazards: 7 },
      hard:   { speed: 28, radius: 1.45, lives: 3, wall: 5.1, hazards: 10 },
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x041018);
    scene.fog = new THREE.FogExp2(0x041018, 0.024);
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.15, 260);
    camera.position.set(0, 5, -10);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x88ddff, 0x080810, 0.55));
    const key = new THREE.DirectionalLight(0xffc080, 1.05);
    key.position.set(8, 18, 6);
    scene.add(key);
    const neon = new THREE.PointLight(0x33ffcc, 28, 36);
    scene.add(neon);
    const amber = new THREE.PointLight(0xffaa44, 18, 30);
    scene.add(amber);
    const boostLight = new THREE.PointLight(0xff6622, 0, 18);
    scene.add(boostLight);

    function loadTex(url, repeatX, repeatY) {
      const t = new THREE.TextureLoader().load(url);
      t.colorSpace = THREE.SRGBColorSpace;
      if (repeatX) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatX, repeatY);
      }
      return t;
    }

    function chromaTexture(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const x = c.getContext("2d");
          x.drawImage(img, 0, 0);
          const d = x.getImageData(0, 0, c.width, c.height);
          const p = d.data;
          for (let i = 0; i < p.length; i += 4) {
            const r = p[i], g = p[i + 1], b = p[i + 2];
            if (r > 140 && b > 90 && g < 160 && g < r * 0.78 && (r + b) > g * 2.2) p[i + 3] = 0;
          }
          for (let i = 0; i < p.length; i += 4) {
            if (p[i + 3] === 0) continue;
            const n = neighborsKeyed(p, i, c.width, c.height);
            if (n >= 3) p[i + 3] = Math.min(p[i + 3], 80);
          }
          x.putImageData(d, 0, 0);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.needsUpdate = true;
          resolve(tex);
        };
        img.src = url;
      });
    }
    function neighborsKeyed(p, i, w, h) {
      const px = (i / 4) % w, py = Math.floor(i / 4 / w);
      let n = 0;
      for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const x = px + dx, y = py + dy;
        if (x < 0 || y < 0 || x >= w || y >= h) continue;
        if (p[(y * w + x) * 4 + 3] === 0) n++;
      }
      return n;
    }

    const cityTex = loadTex("art/city.jpg");
    const facadeTex = loadTex("art/facade.jpg", 1, 2);
    const streetTex = loadTex("art/street.jpg", 2, 18);
    const city = new THREE.Mesh(new THREE.PlaneGeometry(110, 62), new THREE.MeshBasicMaterial({ map: cityTex }));
    city.position.set(0, 10, 90);
    scene.add(city);

    const street = new THREE.Mesh(
      new THREE.PlaneGeometry(22, 420),
      new THREE.MeshStandardMaterial({ map: streetTex, roughness: 0.22, metalness: 0.55, color: 0x8899aa })
    );
    street.rotation.x = -Math.PI / 2;
    street.position.set(0, 0, 120);
    scene.add(street);

    const buildings = new THREE.Group();
    scene.add(buildings);
    const facadeMat = new THREE.MeshStandardMaterial({
      map: facadeTex, roughness: 0.38, metalness: 0.62, emissive: 0x0a2a30, emissiveIntensity: 0.55,
    });
    const glowTeal = new THREE.MeshBasicMaterial({ color: 0x33ffcc, transparent: true, opacity: 0.55 });
    const glowAmber = new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.45 });

    const TOWERS = [];
    function makeTower(side, z, h) {
      const g = new THREE.Group();
      const w = 3.4 + Math.random() * 1.4;
      const d = 4.2 + Math.random() * 2;
      const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), facadeMat);
      box.position.y = h / 2;
      g.add(box);
      const strip = new THREE.Mesh(new THREE.BoxGeometry(0.12, h * 0.72, d * 0.7), Math.random() > 0.45 ? glowTeal : glowAmber);
      strip.position.set(side < 0 ? w * 0.48 : -w * 0.48, h * 0.42, 0);
      g.add(strip);
      g.position.set(side * (7.4 + w * 0.35), 0, z);
      g.userData = { side, w, h, d };
      buildings.add(g);
      TOWERS.push(g);
      return g;
    }
    for (let i = 0; i < 28; i++) {
      const z = -6 + i * 9;
      makeTower(-1, z, 10 + (i * 17) % 16);
      makeTower(1, z + 2.2, 9 + (i * 13) % 18);
    }

    const bridges = [];
    function makeBridge(z) {
      const g = new THREE.Group();
      const deck = new THREE.Mesh(
        new THREE.BoxGeometry(16, 0.35, 2.2),
        new THREE.MeshStandardMaterial({ color: 0x0a2030, emissive: 0x1a6a70, emissiveIntensity: 0.8, metalness: 0.7, roughness: 0.3 })
      );
      deck.position.y = 9.4;
      g.add(deck);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(16, 0.08, 0.08), glowTeal);
      rail.position.set(0, 9.6, 0.9);
      g.add(rail);
      g.position.z = z;
      scene.add(g);
      bridges.push(g);
    }
    for (let i = 0; i < 8; i++) makeBridge(18 + i * 28);

    const rainGeo = new THREE.BufferGeometry();
    const rainN = 1800;
    const rainPos = new Float32Array(rainN * 3);
    for (let i = 0; i < rainN; i++) {
      rainPos[i * 3] = (Math.random() - 0.5) * 36;
      rainPos[i * 3 + 1] = Math.random() * 28;
      rainPos[i * 3 + 2] = Math.random() * 90 - 10;
    }
    rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x88c8e8, size: 0.055, transparent: true, opacity: 0.42 }));
    scene.add(rain);

    const trailGeo = new THREE.BufferGeometry();
    const trailN = 90;
    const trailPos = new Float32Array(trailN * 3);
    trailGeo.setAttribute("position", new THREE.BufferAttribute(trailPos, 3));
    const trail = new THREE.Points(trailGeo, new THREE.PointsMaterial({ color: 0xff8844, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(trail);

    const rings = [];
    const hazards = [];
    const ringGlow = new THREE.MeshBasicMaterial({ color: 0x5ee0c8, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
    function clearGroup(arr) {
      arr.forEach((o) => scene.remove(o.mesh || o));
      arr.length = 0;
    }
    function placeCourse(D) {
      clearGroup(rings);
      hazards.forEach((h) => scene.remove(h));
      hazards.length = 0;
      for (let i = 0; i < RING_N; i++) {
        const z = 16 + i * 15;
        const x = Math.sin(i * 0.68) * 2.8;
        const y = 3.1 + Math.cos(i * 0.52) * 1.9;
        const g = new THREE.Group();
        const torus = new THREE.Mesh(new THREE.TorusGeometry(D.radius, 0.07, 12, 48), new THREE.MeshBasicMaterial({ color: 0x5ee0c8 }));
        const disc = new THREE.Mesh(new THREE.RingGeometry(D.radius * 0.2, D.radius, 32), ringGlow);
        torus.rotation.y = Math.PI / 2;
        disc.rotation.y = Math.PI / 2;
        g.add(torus, disc);
        g.position.set(x, y, z);
        scene.add(g);
        rings.push({ mesh: g, torus, taken: false, x, y, z, radius: D.radius });
      }
      for (let i = 0; i < D.hazards; i++) {
        const z = 22 + i * ((RING_N * 15) / D.hazards);
        const x = Math.cos(i * 1.7) * 2.4;
        const y = 2.6 + (i % 3) * 1.6;
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(1.1, 1.1, 0.35),
          new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0xff2244, emissiveIntensity: 0.9, roughness: 0.3 })
        );
        bar.position.set(x, y, z);
        scene.add(bar);
        hazards.push(bar);
      }
    }

    const [rearTex, flapTex] = await Promise.all([
      chromaTexture("art/drake-rear.jpg"),
      chromaTexture("art/drake-flap.jpg"),
    ]);
    const dragonMat = new THREE.SpriteMaterial({ map: rearTex, transparent: true, depthWrite: false });
    const dragon = new THREE.Sprite(dragonMat);
    dragon.scale.set(2.7, 2.7, 1);
    scene.add(dragon);

    const keys = Object.create(null);
    const ptr = { x: 0, y: 0, down: 0, t: 0, x0: 0, y0: 0 };
    addEventListener("keydown", (e) => {
      keys[e.code] = 1;
      if (e.code === "Space") e.preventDefault();
    });
    addEventListener("keyup", (e) => { keys[e.code] = 0; });
    function setPtr(e) {
      ptr.x = (e.clientX / innerWidth) * 2 - 1;
      ptr.y = -((e.clientY / innerHeight) * 2 - 1);
    }
    renderer.domElement.addEventListener("pointerdown", (e) => {
      ptr.down = 1; setPtr(e); ptr.t = performance.now(); ptr.x0 = e.clientX; ptr.y0 = e.clientY;
    });
    addEventListener("pointerup", (e) => {
      if (running && ptr.down && performance.now() - ptr.t < 220 && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) < 14) tryBoost();
      ptr.down = 0;
    });
    addEventListener("pointermove", (e) => { if (ptr.down) setPtr(e); });
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let actx;
    function tone(freq, dur, type, vol) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.value = vol || 0.05;
        o.connect(g); g.connect(actx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        o.stop(actx.currentTime + dur);
      } catch (_) {}
    }

    let running = false, win = false;
    let pos = new THREE.Vector3(0, 3.4, 0);
    let vel = new THREE.Vector3();
    let lives = 4, got = 0, next = 0, speed = 22, t = 0, inv = 0, shake = 0;
    let boostT = 0, boostCd = 0, wall = 5.6;
    let lastRing = new THREE.Vector3(0, 3.4, 0);
    let diffName = "normal";
    let trailI = 0;

    function start(d) {
      diffName = d || "normal";
      const D = DIFF[diffName];
      speed = D.speed; lives = D.lives; wall = D.wall;
      got = 0; next = 0; t = 0; inv = 0; shake = 0; boostT = 0; boostCd = 0;
      pos.set(0, 3.4, 0); vel.set(0, 0, 0); lastRing.set(0, 3.4, 0);
      win = false; running = true;
      placeCourse(D);
      document.getElementById("title").style.display = "none";
      document.getElementById("pause").style.display = "none";
      document.getElementById("port").classList.add("on");
      document.getElementById("boostbar").classList.add("on");
      tone(220, 0.12, "triangle", 0.04);
    }

    function end(title, sub) {
      running = false;
      document.getElementById("end").textContent = title;
      document.getElementById("endsub").textContent = sub;
      document.getElementById("pause").style.display = "grid";
      document.getElementById("port").classList.remove("on");
      document.getElementById("boostbar").classList.remove("on");
    }

    function tryBoost() {
      if (!running || boostCd > 0) return;
      boostT = 0.48; boostCd = 1.35;
      tone(140, 0.18, "sawtooth", 0.045);
      tone(320, 0.12, "triangle", 0.03);
    }

    function steer() {
      let x = 0, y = 0;
      if (keys.KeyA || keys.ArrowLeft) x -= 1;
      if (keys.KeyD || keys.ArrowRight) x += 1;
      if (keys.KeyW || keys.ArrowUp) y += 1;
      if (keys.KeyS || keys.ArrowDown) y -= 1;
      if (keys.Space) tryBoost();
      if (ptr.down) { x += ptr.x * 1.4; y += ptr.y * 1.2; }
      const m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      return { x, y };
    }

    function bump(why) {
      if (inv > 0) return;
      lives--; inv = 1.05; shake = 0.35;
      pos.copy(lastRing); pos.z -= 1.8; vel.set(0, 0, 0);
      tone(70, 0.22, "square", 0.05);
      if (lives <= 0) end("Signal drop", why + " Try Easy if the lane is tight.");
    }

    function recycleWorld() {
      const z0 = pos.z;
      for (const tw of TOWERS) {
        if (tw.position.z < z0 - 18) tw.position.z += 28 * 9;
      }
      for (const b of bridges) {
        if (b.position.z < z0 - 16) b.position.z += 8 * 28;
      }
      street.position.z = z0 + 80;
      city.position.z = z0 + 92;
    }

    function tick(dt) {
      t += dt;
      if (!running) {
        camera.position.lerp(new THREE.Vector3(Math.sin(t * 0.15) * 1.2, 5.2, -9), 0.04);
        camera.lookAt(0, 3.2, 14);
        dragon.position.set(0, 3.4 + Math.sin(t * 2.2) * 0.18, 0);
        dragonMat.rotation = Math.sin(t * 1.6) * 0.08;
        neon.position.set(0, 4.4, 2);
        amber.position.set(-5, 4, 6);
        flapAnim();
        rainTick(dt, 14);
        renderer.render(scene, camera);
        return;
      }

      inv = Math.max(0, inv - dt);
      shake = Math.max(0, shake - dt);
      boostT = Math.max(0, boostT - dt);
      boostCd = Math.max(0, boostCd - dt);
      const boosting = boostT > 0;
      const s = steer();
      vel.x += s.x * 30 * dt;
      vel.y += s.y * 24 * dt;
      vel.x *= 0.86; vel.y *= 0.88;
      pos.x += vel.x * dt;
      pos.y += vel.y * dt;
      pos.z += (speed * (boosting ? 1.55 : 1)) * dt;
      pos.x = THREE.MathUtils.clamp(pos.x, -wall, wall);
      pos.y = THREE.MathUtils.clamp(pos.y, 1.15, 8.2);

      const ring = rings[next];
      if (ring && !ring.taken) {
        const d = pos.distanceTo(ring.mesh.position);
        const grab = ring.radius + (boosting ? 1.15 : 0.72);
        if (d < grab) {
          ring.taken = true;
          ring.torus.material.color.setHex(0xffc060);
          got++; next++; lastRing.copy(ring.mesh.position);
          shake = 0.12;
          tone(520 + got * 18, 0.09, "sine", 0.05);
          if (got >= RING_N) {
            win = true;
            tone(523, 0.16, "triangle", 0.05);
            setTimeout(() => tone(659, 0.18, "triangle", 0.05), 120);
            setTimeout(() => tone(784, 0.28, "triangle", 0.05), 240);
            end("Lane clear", got + " rings. The city keeps raining.");
          }
        } else if (pos.z > ring.z + 5.5) {
          pos.lerp(new THREE.Vector3(ring.x, ring.y, ring.z - 2.2), 0.42);
          vel.set(0, 0, 0);
        }
      }
      if (pos.z > 16 + RING_N * 15 + 10) pos.z = lastRing.z;

      for (const h of hazards) {
        if (inv > 0) continue;
        if (pos.distanceTo(h.position) < 0.95) bump("A red node clipped the lane.");
      }

      dragon.position.copy(pos);
      dragonMat.rotation = THREE.MathUtils.lerp(dragonMat.rotation, -vel.x * 0.045, 0.2);
      dragon.material.opacity = inv > 0 && Math.sin(t * 28) > 0 ? 0.35 : 1;
      flapAnim();
      if (boosting) dragon.scale.set(3.05, 2.55, 1);
      else dragon.scale.set(2.7, 2.7, 1);

      neon.position.set(pos.x, pos.y + 1, pos.z + 2);
      amber.position.set(pos.x - 4, pos.y + 2, pos.z + 6);
      boostLight.position.copy(pos);
      boostLight.intensity = boosting ? 22 : 0;

      trailPos[trailI * 3] = pos.x + (Math.random() - 0.5) * 0.2;
      trailPos[trailI * 3 + 1] = pos.y - 0.2;
      trailPos[trailI * 3 + 2] = pos.z - 0.4;
      trailI = (trailI + 1) % trailN;
      trail.geometry.attributes.position.needsUpdate = true;
      trail.material.color.setHex(boosting ? 0xffaa44 : 0xff6633);

      rainTick(dt, speed);
      recycleWorld();

      const camTarget = new THREE.Vector3(pos.x * 0.38, pos.y + 1.55, pos.z - 8.8);
      if (shake > 0) {
        camTarget.x += (Math.random() - 0.5) * shake * 1.4;
        camTarget.y += (Math.random() - 0.5) * shake * 1.1;
      }
      camera.position.lerp(camTarget, 1 - Math.pow(0.00015, dt));
      camera.lookAt(pos.x, pos.y + 0.25, pos.z + 9);

      const cdFrac = boostCd <= 0 ? 1 : 1 - boostCd / 1.35;
      document.getElementById("boosti").style.width = (boostT > 0 ? 100 : cdFrac * 100) + "%";
      document.getElementById("boosti").style.background = boostT > 0 ? "#ffaa44" : "#5ee0c8";
      document.getElementById("hud").textContent =
        (got === 0 ? "Fly through the glowing ring  ·  " : "") +
        "Rings " + got + "/" + RING_N + "  ·  lives " + lives + (boosting ? "  ·  burst" : "");
    }

    function flapAnim() {
      dragonMat.map = (Math.sin(t * 14) > 0) ? rearTex : flapTex;
      dragonMat.needsUpdate = true;
    }
    function rainTick(dt, spd) {
      const rp = rain.geometry.attributes.position;
      const z0 = running ? pos.z : 0;
      for (let i = 0; i < rp.count; i++) {
        let y = rp.getY(i) - 20 * dt;
        let z = rp.getZ(i) - spd * dt * 0.35;
        if (y < 0) y += 28;
        if (z < z0 - 10) z += 90;
        rp.setY(i, y); rp.setZ(i, z);
      }
      rp.needsUpdate = true;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      tick(dt);
      if (running) renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    document.querySelectorAll("#title button").forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll("#title button").forEach((x) => x.classList.toggle("on", x === b));
        start(b.dataset.d);
      };
    });
    addEventListener("keydown", (e) => {
      if (e.code === "Escape") location.href = "../../";
    });
    document.getElementById("again").onclick = () => {
      document.getElementById("pause").style.display = "none";
      document.getElementById("title").style.display = "grid";
    };
  </script>
