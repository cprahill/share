<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/share/retro/play/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Retro</title>
  <link rel="stylesheet" href="shell.css" />
  <style>
    #hud { margin-left: auto; font: 700 12px/1 ui-monospace, monospace; color: var(--gold); }
    .over { position: fixed; inset: 0; top: 48px; display: none; place-items: center; background: #07080ccc; z-index: 10; text-align: center; }
    .over.on { display: grid; }
    button {
      appearance: none; cursor: pointer; background: var(--go); color: #0b1016;
      border: 0; border-radius: 8px; font: 700 12px/2.4 ui-monospace, monospace;
      letter-spacing: .12em; text-transform: uppercase; padding: 0 1rem;
    }
    canvas#c { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../">Hall</a>
    <span class="era" id="era"></span>
    <span class="name" id="name"></span>
    <span class="hint" id="hint"></span>
    <span id="hud">0</span>
  </div>
  <canvas id="c"></canvas>
  <div class="over" id="over"><div><h2 id="end">GAME OVER</h2><p id="sc"></p><button type="button" id="again">Again</button></div></div>
  <script src="kit.js"></script>
  <script src="cabs.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("g") || "paddle";
    const cab = (window.RETRO_CABS || []).find((c) => c.id === id) || window.RETRO_CABS[0];
    document.title = cab.title;
    document.getElementById("era").textContent = cab.era;
    document.getElementById("name").textContent = cab.title;
    document.getElementById("hint").textContent = cab.hint;
    const cvs = document.getElementById("c");
    const over = document.getElementById("over");
    const hud = document.getElementById("hud");
    const api = {
      sfx: (window.RetroKit && RetroKit.sfx) || {},
      hud(t) { hud.textContent = t; },
      over(title, sub) {
        document.getElementById("end").textContent = title || "GAME OVER";
        document.getElementById("sc").textContent = sub || "";
        over.classList.add("on");
      }
    };
    let handle = window.bootCab(id, cvs, api);
    document.getElementById("again").onclick = () => {
      over.classList.remove("on");
      if (handle && handle.destroy) handle.destroy();
      handle = window.bootCab(id, cvs, api);
    };
  </script>
</body>
</html>
