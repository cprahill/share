<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>SHADE STAKE</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;color:#c8d0e0;font-family:Impact,"Arial Narrow",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:8px;box-sizing:border-box}
  #tube{position:relative;width:min(960px,96vw,calc((100vh - 16px)*4/3));aspect-ratio:4/3;max-height:calc(100vh - 16px);background:#050508;box-shadow:0 0 0 8px #12141a,0 0 0 10px #2a2e38,inset 0 0 48px #000;overflow:hidden}
  #tube::after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px);mix-blend-mode:multiply}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,8,.84);text-align:center;gap:10px;padding:16px;z-index:3}
  #overlay h1{margin:0;color:#5ec8ff;font-size:clamp(28px,6vw,44px);letter-spacing:.14em;text-shadow:0 0 18px rgba(94,200,255,.5)}
  #overlay p{margin:0;max-width:32em;line-height:1.4;color:#c8d0e0;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;font-weight:500}
  #overlay .go{color:#ff3d7a;font-size:18px;letter-spacing:.2em}
  .hidden{display:none!important}
  #pad{display:none;position:absolute;left:0;right:0;bottom:0;height:28%;z-index:4;pointer-events:none}
  body.touch #pad{display:block}
  #pad .stick{pointer-events:auto;position:absolute;left:4%;bottom:10%;width:38%;height:78%;border:1px solid #2a3a44;border-radius:12px;background:rgba(8,12,16,.45)}
  #pad .btns{pointer-events:auto;position:absolute;right:4%;bottom:14%;display:flex;gap:10px}
  #pad b{width:58px;height:58px;border-radius:50%;border:2px solid #3a4;background:#1c2420;color:#c8f4e8;display:grid;place-items:center;font:700 11px/1 ui-monospace,monospace}
  #pad b.on{background:#3df0c8;color:#041}
</style>
</head>
<body>
<div id="wrap">
  <div id="tube">
    <canvas id="c" width="640" height="480" tabindex="0" aria-label="Shade Stake playfield"></canvas>
    <div id="overlay">
      <h1>SHADE STAKE</h1>
      <p>You are the only tower. Dash to plant a two-second shade of yourself that keeps firing. Cover the floor with afterimages — this is a dance, not a base.</p>
      <p>WASD / arrows move · Space / Z / dash btn plant-dash · auto-aim</p>
      <p id="hiLine"></p>
      <div class="go">INSERT COIN · PRESS START</div>
    </div>
    <div id="pad">
      <div class="stick" id="stick"></div>
      <div class="btns"><b data-act="dash">DASH</b><b data-act="start">GO</b></div>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const W = 640, H = 480;
  const MINT = '#7dffb3', AMBER = '#ffc14a', HOT = '#ff3d7a', CHROME = '#c8d0e0', CYAN = '#5ec8ff', VIOLET = '#b388ff';
  const HS = 'retro.shade-stake.hi';
  const DT = 1000 / 60;
  let acc = 0, last = performance.now();
  function isTouch() { return matchMedia('(pointer:coarse)').matches || innerWidth < 780; }
  document.body.classList.toggle('touch', isTouch());
  addEventListener('resize', () => document.body.classList.toggle('touch', isTouch()));

  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {}
  }
  function beep(f, d, t = 'square', g = 0.04) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = t; o.frequency.value = f;
      gn.gain.setValueAtTime(Math.max(0.0008, g), audioCtx.currentTime);
      gn.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + Math.max(0.02, d));
      o.connect(gn); gn.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + Math.max(0.02, d) + 0.02);
    } catch (_) {}
  }
  function dashTick() { beep(220, 0.06, 'sawtooth', 0.05); beep(880, 0.04, 'square', 0.03); }
  function shotTick() { beep(760, 0.02, 'square', 0.03); }
  function hitTick() { beep(80, 0.16, 'sawtooth', 0.07); }
  function killTick() { beep(520, 0.04, 'triangle', 0.03); }

  function loadHi() { return parseInt(localStorage.getItem(HS) || '0', 10) || 0; }
  function saveHi(v) {
    const h = loadHi();
    if (v > h) { localStorage.setItem(HS, String(v)); return v; }
    return h;
  }
  document.getElementById('hiLine').textContent = 'HIGH ' + loadHi();

  const keys = {};
  const impulse = {};
  const pointer = { down: false, x: 320, y: 240 };
  let stickV = null;
  let holdUntil = 0;
  function canStart() { return performance.now() >= holdUntil; }

  function onKey(e, down) {
    const c = e.code || '';
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','Enter','KeyA','KeyD','KeyW','KeyS','ShiftLeft'].includes(c)) e.preventDefault();
    if (down && !keys[c]) impulse[c] = true;
    keys[c] = down;
    if (!down) return;
    ensureAudio();
    if ((c === 'Enter' || (c === 'Space' && state.phase !== 'play')) && state.phase !== 'play' && canStart()) startGame();
  }
  addEventListener('keydown', e => onKey(e, true), true);
  addEventListener('keyup', e => onKey(e, false), true);

  function worldPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  }
  canvas.addEventListener('pointerdown', ev => {
    ev.preventDefault(); canvas.focus(); ensureAudio();
    if (state.phase !== 'play') { if (canStart()) startGame(); return; }
    pointer.down = true; const p = worldPos(ev); pointer.x = p.x; pointer.y = p.y;
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
  });
  overlay.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); if (canStart()) startGame(); });
  canvas.addEventListener('pointermove', ev => { if (!pointer.down) return; const p = worldPos(ev); pointer.x = p.x; pointer.y = p.y; });
  canvas.addEventListener('pointerup', () => { pointer.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const stick = document.getElementById('stick');
  stick.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ev.stopPropagation();
    try { stick.setPointerCapture(ev.pointerId); } catch (_) {}
    const r = stick.getBoundingClientRect();
    stickV = { x: (ev.clientX - r.left) / r.width - 0.5, y: (ev.clientY - r.top) / r.height - 0.5 };
    ensureAudio();
    if (state.phase !== 'play' && canStart()) startGame();
  });
  stick.addEventListener('pointermove', ev => {
    if (!stickV) return;
    const r = stick.getBoundingClientRect();
    stickV = { x: (ev.clientX - r.left) / r.width - 0.5, y: (ev.clientY - r.top) / r.height - 0.5 };
  });
  stick.addEventListener('pointerup', () => { stickV = null; });
  document.querySelectorAll('#pad [data-act]').forEach(b => {
    b.addEventListener('pointerdown', ev => {
      ev.preventDefault(); b.classList.add('on'); ensureAudio();
      const act = b.getAttribute('data-act');
      if (act === 'dash') impulse.KeyZ = true;
      if (act === 'start' && state.phase !== 'play' && canStart()) startGame();
    });
    b.addEventListener('pointerup', () => b.classList.remove('on'));
    b.addEventListener('pointercancel', () => b.classList.remove('on'));
  });

  const state = {
    phase: 'title',
    p: { x: 320, y: 240, a: 0, vx: 0, vy: 0 },
    shades: [],
    creeps: [],
    shots: [],
    sparks: [],
    hp: 3,
    inv: 0,
    dashCd: 0,
    fireT: 0,
    t: 0,
    wave: 1,
    score: 0,
    kills: 0,
    spawnT: 0,
    shake: 0,
    flash: 0,
    msg: '',
    msgT: 0,
    facing: { x: 1, y: 0 }
  };

  function startGame() {
    if (!canStart()) return;
    ensureAudio();
    state.phase = 'play';
    state.p = { x: 320, y: 240, a: 0, vx: 0, vy: 0 };
    state.shades = [];
    state.creeps = [];
    state.shots = [];
    state.sparks = [];
    state.hp = 3;
    state.inv = 40;
    state.dashCd = 0;
    state.fireT = 0;
    state.t = 0;
    state.wave = 1;
    state.score = 0;
    state.kills = 0;
    state.spawnT = 20;
    state.facing = { x: 1, y: 0 };
    state.msg = 'DASH PLANTS A 2s SHADE';
    state.msgT = 90;
    overlay.classList.add('hidden');
    try { canvas.focus(); } catch (_) {}
    beep(330, 0.08); beep(440, 0.1);
  }

  function die() {
    hitTick();
    const hi = saveHi(state.score);
    state.phase = 'dead';
    holdUntil = performance.now() + 900;
    overlay.classList.remove('hidden');
    overlay.innerHTML = `<h1>STAKE PULLED</h1><p>${state.kills} creeps · wave ${state.wave} · Score <b>${state.score}</b></p><p>High ${hi}</p><div class="go">PRESS START</div>`;
  }

  function hurt() {
    if (state.inv > 0 || state.phase !== 'play') return;
    hitTick();
    state.hp--;
    state.inv = 55;
    state.shake = 8;
    state.flash = 4;
    if (state.hp <= 0) die();
  }

  function nearest(from) {
    let best = null, d = 1e9;
    for (const c of state.creeps) {
      const k = Math.hypot(c.x - from.x, c.y - from.y);
      if (k < d) { d = k; best = c; }
    }
    return best;
  }

  function fireFrom(src, col) {
    const n = nearest(src);
    if (!n) return;
    const a = Math.atan2(n.y - src.y, n.x - src.x);
    state.shots.push({ x: src.x + Math.cos(a) * 12, y: src.y + Math.sin(a) * 12, vx: Math.cos(a) * 6.2, vy: Math.sin(a) * 6.2, col });
    if (state.t % 3 === 0) shotTick();
  }

  function dash() {
    if (state.dashCd > 0) return;
    dashTick();
    state.shades.push({ x: state.p.x, y: state.p.y, life: 120, fireT: 0 });
    state.p.x = Math.max(20, Math.min(W - 20, state.p.x + state.facing.x * 86));
    state.p.y = Math.max(48, Math.min(H - 20, state.p.y + state.facing.y * 86));
    state.inv = Math.max(state.inv, 14);
    state.dashCd = 28;
    for (let i = 0; i < 8; i++) {
      state.sparks.push({ x: state.p.x, y: state.p.y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 12, color: CYAN });
    }
  }

  function spawnCreep() {
    const edge = (Math.random() * 4) | 0;
    let x, y;
    if (edge === 0) { x = Math.random() * W; y = 36; }
    else if (edge === 1) { x = Math.random() * W; y = H - 12; }
    else if (edge === 2) { x = 12; y = 60 + Math.random() * (H - 80); }
    else { x = W - 12; y = 60 + Math.random() * (H - 80); }
    const kind = state.wave > 3 && Math.random() < 0.25 ? 'heavy' : 'creep';
    state.creeps.push({ x, y, hp: kind === 'heavy' ? 4 : 1, kind, spd: kind === 'heavy' ? 0.75 : 1.25 });
  }

  function update() {
    if (state.phase !== 'play') {
      for (const k of Object.keys(impulse)) delete impulse[k];
      return;
    }
    state.t++;
    if (state.t > 0 && state.t % 1200 === 0) {
      state.wave++;
      state.msg = 'WAVE ' + state.wave;
      state.msgT = 70;
      beep(440, 0.08); beep(660, 0.1);
    }

    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;
    if (stickV) { dx += stickV.x * 2; dy += stickV.y * 2; }
    if (pointer.down) {
      const ax = pointer.x - state.p.x, ay = pointer.y - state.p.y;
      const L = Math.hypot(ax, ay) || 1;
      if (L > 10) { dx += ax / L; dy += ay / L; }
    }
    const L = Math.hypot(dx, dy);
    if (L > 0.2) {
      dx /= L; dy /= L;
      state.facing = { x: dx, y: dy };
      state.p.x = Math.max(18, Math.min(W - 18, state.p.x + dx * 2.4));
      state.p.y = Math.max(46, Math.min(H - 18, state.p.y + dy * 2.4));
    }
    if (state.inv > 0) state.inv--;
    if (state.dashCd > 0) state.dashCd--;
    if (impulse.Space || impulse.KeyZ || impulse.ShiftLeft) dash();

    state.fireT--;
    if (state.fireT <= 0) {
      state.fireT = 9;
      fireFrom(state.p, CYAN);
    }
    for (const sh of state.shades) {
      sh.life--;
      sh.fireT--;
      if (sh.fireT <= 0) {
        sh.fireT = 8;
        fireFrom(sh, VIOLET);
      }
    }
    state.shades = state.shades.filter(s => s.life > 0);

    state.spawnT--;
    if (state.spawnT <= 0) {
      spawnCreep();
      if (state.wave > 1) spawnCreep();
      if (state.shades.length === 0) spawnCreep();
      state.spawnT = Math.max(12, 34 - state.wave * 4);
    }

    for (const c of state.creeps) {
      const a = Math.atan2(state.p.y - c.y, state.p.x - c.x);
      c.x += Math.cos(a) * c.spd;
      c.y += Math.sin(a) * c.spd;
      if (state.inv <= 0 && Math.hypot(c.x - state.p.x, c.y - state.p.y) < (c.kind === 'heavy' ? 16 : 12)) hurt();
    }

    for (const s of state.shots) {
      s.x += s.vx; s.y += s.vy;
      for (const c of state.creeps) {
        if (c.hp <= 0) continue;
        const r = c.kind === 'heavy' ? 14 : 10;
        if (Math.hypot(s.x - c.x, s.y - c.y) < r) {
          c.hp--;
          s.dead = true;
          if (c.hp <= 0) {
            state.kills++;
            state.score += c.kind === 'heavy' ? 35 : 12;
            killTick();
            state.sparks.push({ x: c.x, y: c.y, vx: 0, vy: 0, life: 10, color: s.col });
          }
        }
      }
    }
    state.shots = state.shots.filter(s => !s.dead && s.x > -16 && s.x < W + 16 && s.y > -16 && s.y < H + 16);
    state.creeps = state.creeps.filter(c => c.hp > 0);
    state.sparks = state.sparks.filter(s => { s.x += s.vx; s.y += s.vy; s.life--; return s.life > 0; });
    if (state.shake > 0) state.shake--;
    if (state.flash > 0) state.flash--;
    if (state.msgT > 0) state.msgT--;
    for (const k of Object.keys(impulse)) delete impulse[k];
  }

  function drawTower(x, y, col, alpha, lifeFrac) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + state.t * 0.01;
      const px = x + Math.cos(a) * 11;
      const py = y + Math.sin(a) * 11;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    if (lifeFrac != null) {
      ctx.strokeStyle = AMBER;
      ctx.beginPath();
      ctx.arc(x, y, 16, -Math.PI / 2, -Math.PI / 2 + lifeFrac * Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (state.shake) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(94,200,255,0.05)';
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

    ctx.fillStyle = CYAN;
    ctx.font = '16px Impact, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SHADE STAKE', 14, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = CHROME;
    ctx.fillText('SCR ' + state.score + '  ·  WAVE ' + state.wave + '  ·  HP ' + state.hp + '  ·  HI ' + loadHi(), W - 14, 24);

    if (state.phase !== 'title') {
      for (const sh of state.shades) drawTower(sh.x, sh.y, VIOLET, 0.4 + 0.5 * (sh.life / 120), sh.life / 120);
      const n = nearest(state.p);
      if (n) {
        ctx.strokeStyle = 'rgba(94,200,255,0.25)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(state.p.x, state.p.y); ctx.lineTo(n.x, n.y); ctx.stroke();
        ctx.setLineDash([]);
      }
      drawTower(state.p.x, state.p.y, CYAN, state.inv > 0 && state.inv % 6 < 3 ? 0.4 : 1, null);
      if (state.dashCd === 0) {
        ctx.strokeStyle = MINT;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.moveTo(state.p.x, state.p.y);
        ctx.lineTo(state.p.x + state.facing.x * 28, state.p.y + state.facing.y * 28);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      for (const c of state.creeps) {
        ctx.strokeStyle = c.kind === 'heavy' ? AMBER : HOT;
        ctx.lineWidth = 2;
        const r = c.kind === 'heavy' ? 12 : 7;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y - r); ctx.lineTo(c.x + r, c.y + r * 0.7); ctx.lineTo(c.x - r, c.y + r * 0.7);
        ctx.closePath(); ctx.stroke();
      }
      for (const s of state.shots) { ctx.fillStyle = s.col; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
    }
    for (const s of state.sparks) { ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, 2, 2); }
    if (state.msgT > 0 && state.phase === 'play') {
      ctx.fillStyle = AMBER;
      ctx.font = '16px Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.msg, W / 2, 52);
    }
    if (state.flash) { ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  function frame(now) {
    acc += now - last; last = now;
    if (acc > 200) acc = 200;
    while (acc >= DT) { try { update(); } catch (e) { console.error(e); } acc -= DT; }
    try { draw(); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  try { canvas.focus(); } catch (_) {}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
