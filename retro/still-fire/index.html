<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>STILL FIRE</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;color:#c8d0e0;font-family:Impact,"Arial Narrow",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:8px;box-sizing:border-box}
  #tube{position:relative;width:min(960px,96vw,calc((100vh - 16px)*4/3));aspect-ratio:4/3;max-height:calc(100vh - 16px);background:#050508;box-shadow:0 0 0 8px #12141a,0 0 0 10px #2a2e38,inset 0 0 48px #000;overflow:hidden}
  #tube::after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px);mix-blend-mode:multiply}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,8,.84);text-align:center;gap:10px;padding:16px;z-index:3}
  #overlay h1{margin:0;color:#ff3d7a;font-size:clamp(28px,6vw,44px);letter-spacing:.14em;text-shadow:0 0 18px rgba(255,61,122,.5)}
  #overlay p{margin:0;max-width:32em;line-height:1.4;color:#c8d0e0;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;font-weight:500}
  #overlay .go{color:#7dffb3;font-size:18px;letter-spacing:.2em}
  .hidden{display:none!important}
  #pad{display:none;position:absolute;left:0;right:0;bottom:0;height:28%;z-index:4;pointer-events:none}
  body.touch #pad{display:block}
  #pad .stick{pointer-events:auto;position:absolute;left:4%;bottom:10%;width:42%;height:78%;border:1px solid #2a3a44;border-radius:12px;background:rgba(8,12,16,.45)}
  #pad .hint{pointer-events:none;position:absolute;right:6%;bottom:22%;color:#8b9388;font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;text-align:right}
</style>
</head>
<body>
<div id="wrap">
  <div id="tube">
    <canvas id="c" width="640" height="480" tabindex="0" aria-label="Still Fire playfield"></canvas>
    <div id="overlay">
      <h1>STILL FIRE</h1>
      <p>Three minutes. Weapons fire only when you stand still. Move to live. Plant to kill. Motion is the risk.</p>
      <p>WASD / arrows / drag to move · no fire button — stillness is the trigger</p>
      <p id="hiLine"></p>
      <div class="go">INSERT COIN · PRESS START</div>
    </div>
    <div id="pad">
      <div class="stick" id="stick"></div>
      <div class="hint">stand still<br>to fire</div>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const W = 640, H = 480;
  const MINT = '#7dffb3', AMBER = '#ffc14a', HOT = '#ff3d7a', CHROME = '#c8d0e0', CYAN = '#5ec8ff';
  const HS = 'retro.still-fire.hi';
  const DT = 1000 / 60;
  const MATCH = 180;
  let acc = 0, last = performance.now();
  const coarse = matchMedia('(pointer:coarse)').matches || matchMedia('(hover:none)').matches || 'ontouchstart' in window;
  if (coarse || innerWidth < 820) document.body.classList.add('touch');

  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {}
  }
  function beep(f, d, t = 'square', g = 0.04) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = t; o.frequency.value = f;
      gn.gain.setValueAtTime(Math.max(0.0008, g), audioCtx.currentTime);
      gn.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + Math.max(0.02, d));
      o.connect(gn); gn.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + Math.max(0.02, d) + 0.02);
    } catch (_) {}
  }
  function shotTick() { beep(1040, 0.025, 'square', 0.035); }
  function lockTick() { beep(480, 0.04, 'triangle', 0.03); }
  function gemTick() { beep(880, 0.04, 'sine', 0.03); }
  function hitTick() { beep(70, 0.16, 'sawtooth', 0.07); }
  function winTick() { beep(523, 0.1); beep(659, 0.1); beep(784, 0.16); }

  function loadHi() { return parseInt(localStorage.getItem(HS) || '0', 10) || 0; }
  function saveHi(v) {
    const h = loadHi();
    if (v > h) { localStorage.setItem(HS, String(v)); return v; }
    return h;
  }
  document.getElementById('hiLine').textContent = 'HIGH ' + loadHi();

  const keys = {};
  const pointer = { down: false, x: 320, y: 240 };
  let stickV = null;
  let holdUntil = 0;
  function canStart() { return performance.now() >= holdUntil; }

  function onKey(e, down) {
    const c = e.code || '';
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter','KeyA','KeyD','KeyW','KeyS'].includes(c)) e.preventDefault();
    keys[c] = down;
    if (!down) return;
    ensureAudio();
    if ((c === 'Enter' || c === 'Space') && state.phase !== 'play' && canStart()) startGame();
  }
  addEventListener('keydown', e => onKey(e, true), true);
  addEventListener('keyup', e => onKey(e, false), true);

  function worldPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  }
  canvas.addEventListener('pointerdown', ev => {
    ev.preventDefault(); canvas.focus(); ensureAudio();
    if (state.phase !== 'play') { if (canStart()) startGame(); return; }
    pointer.down = true; const p = worldPos(ev); pointer.x = p.x; pointer.y = p.y;
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
  });
  overlay.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); if (canStart()) startGame(); });
  canvas.addEventListener('pointermove', ev => { if (!pointer.down) return; const p = worldPos(ev); pointer.x = p.x; pointer.y = p.y; });
  canvas.addEventListener('pointerup', () => { pointer.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const stick = document.getElementById('stick');
  stick.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ev.stopPropagation();
    try { stick.setPointerCapture(ev.pointerId); } catch (_) {}
    const r = stick.getBoundingClientRect();
    stickV = { x: (ev.clientX - r.left) / r.width - 0.5, y: (ev.clientY - r.top) / r.height - 0.5 };
    ensureAudio();
    if (state.phase !== 'play' && canStart()) startGame();
  });
  stick.addEventListener('pointermove', ev => {
    if (!stickV) return;
    const r = stick.getBoundingClientRect();
    stickV = { x: (ev.clientX - r.left) / r.width - 0.5, y: (ev.clientY - r.top) / r.height - 0.5 };
  });
  stick.addEventListener('pointerup', () => { stickV = null; });

  const state = {
    phase: 'title',
    p: { x: 320, y: 240 },
    still: 0,
    locked: false,
    hp: 4,
    inv: 0,
    t: 0,
    left: MATCH,
    score: 0,
    kills: 0,
    xp: 0,
    lvl: 1,
    enemies: [],
    gems: [],
    shots: [],
    sparks: [],
    fireT: 0,
    spawnT: 0,
    shake: 0,
    flash: 0,
    msg: '',
    msgT: 0
  };

  function startGame() {
    if (!canStart()) return;
    ensureAudio();
    Object.assign(state, {
      phase: 'play', p: { x: 320, y: 240 }, still: 0, locked: false,
      hp: 4, inv: 50, t: 0, left: MATCH, score: 0, kills: 0, xp: 0, lvl: 1,
      enemies: [], gems: [], shots: [], sparks: [], fireT: 0, spawnT: 20,
      shake: 0, flash: 0, msg: 'PLANT TO FIRE — KITE TO LIVE', msgT: 90
    });
    overlay.classList.add('hidden');
    try { canvas.focus(); } catch (_) {}
    beep(330, 0.08); beep(440, 0.1);
  }

  function end(win) {
    const bonus = win ? 800 : Math.floor((MATCH - state.left) * 2);
    state.score += bonus;
    const hi = saveHi(state.score);
    state.phase = win ? 'win' : 'dead';
    holdUntil = performance.now() + 900;
    overlay.classList.remove('hidden');
    overlay.innerHTML = win
      ? `<h1>STILL STANDING</h1><p>Three minutes. ${state.kills} down. Score <b>${state.score}</b></p><p>High ${hi}</p><div class="go">PRESS START</div>`
      : `<h1>MOVED LAST</h1><p>${state.kills} kills · ${Math.floor(MATCH - state.left)}s · Score <b>${state.score}</b></p><p>High ${hi}</p><div class="go">PRESS START</div>`;
    if (win) winTick(); else hitTick();
  }

  function hurt() {
    if (state.inv > 0) return;
    hitTick();
    state.hp--;
    state.inv = 50;
    state.shake = 8;
    state.flash = 4;
    if (state.hp <= 0) end(false);
  }

  function spawn() {
    const edge = (Math.random() * 4) | 0;
    let x, y;
    if (edge === 0) { x = Math.random() * W; y = -10; }
    else if (edge === 1) { x = Math.random() * W; y = H + 10; }
    else if (edge === 2) { x = -10; y = Math.random() * H; }
    else { x = W + 10; y = Math.random() * H; }
    const elapsed = MATCH - state.left;
    const kind = elapsed > 90 && Math.random() < 0.22 ? 'dart' : (elapsed > 50 && Math.random() < 0.3 ? 'brute' : 'mite');
    const hp = kind === 'brute' ? 5 : kind === 'dart' ? 2 : 1;
    const spd = kind === 'dart' ? 2.1 : kind === 'brute' ? 0.7 : 1.15;
    state.enemies.push({ x, y, hp, spd, kind, telegraph: 0 });
  }

  function nearest(from) {
    let best = null, d = 1e9;
    for (const e of state.enemies) {
      const k = Math.hypot(e.x - from.x, e.y - from.y);
      if (k < d) { d = k; best = e; }
    }
    return best;
  }

  function fire() {
    const n = nearest(state.p);
    if (!n) return;
    const a = Math.atan2(n.y - state.p.y, n.x - state.p.x);
    const count = state.lvl;
    for (let i = 0; i < count; i++) {
      const spread = (i - (count - 1) / 2) * 0.18;
      const ang = a + spread;
      state.shots.push({ x: state.p.x, y: state.p.y, vx: Math.cos(ang) * 6.5, vy: Math.sin(ang) * 6.5, pierce: state.lvl >= 4 ? 1 : 0 });
    }
    if (state.lvl >= 3 && state.t % 20 === 0) {
      for (let i = 0; i < 6; i++) {
        const ang = state.t * 0.02 + i * Math.PI / 3;
        state.shots.push({ x: state.p.x + Math.cos(ang) * 18, y: state.p.y + Math.sin(ang) * 18, vx: Math.cos(ang) * 3.2, vy: Math.sin(ang) * 3.2, pierce: 0 });
      }
    }
    shotTick();
  }

  function update() {
    if (state.phase !== 'play') return;
    state.t++;
    state.left -= DT / 1000;
    if (state.left <= 0) { state.left = 0; end(true); return; }

    let dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.KeyA) dx -= 1;
    if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (keys.ArrowUp || keys.KeyW) dy -= 1;
    if (keys.ArrowDown || keys.KeyS) dy += 1;
    if (stickV) { dx += stickV.x * 2; dy += stickV.y * 2; }
    if (pointer.down) {
      const ax = pointer.x - state.p.x, ay = pointer.y - state.p.y;
      const L = Math.hypot(ax, ay) || 1;
      if (L > 10) { dx += ax / L; dy += ay / L; }
    }
    const L = Math.hypot(dx, dy);
    const moving = L > 0.2;
    if (moving) {
      dx /= L; dy /= L;
      state.p.x = Math.max(16, Math.min(W - 16, state.p.x + dx * 2.7));
      state.p.y = Math.max(42, Math.min(H - 16, state.p.y + dy * 2.7));
      state.still = 0;
      if (state.locked) { state.locked = false; }
    } else {
      state.still++;
      if (!state.locked && state.still === 8) { state.locked = true; lockTick(); }
    }
    if (state.inv > 0) state.inv--;

    state.fireT--;
    if (state.locked && state.fireT <= 0) {
      state.fireT = Math.max(6, 12 - state.lvl);
      fire();
    }

    const elapsed = MATCH - state.left;
    state.spawnT--;
    if (state.spawnT <= 0) {
      spawn();
      if (elapsed > 70) spawn();
      state.spawnT = Math.max(12, 38 - elapsed * 0.12);
    }

    for (const e of state.enemies) {
      const a = Math.atan2(state.p.y - e.y, state.p.x - e.x);
      if (e.kind === 'dart') {
        if (e.telegraph > 0) {
          e.telegraph--;
          if (e.telegraph === 0) {
            e.x += Math.cos(a) * 28;
            e.y += Math.sin(a) * 28;
          }
        } else if (Math.hypot(e.x - state.p.x, e.y - state.p.y) < 130 && Math.random() < 0.02) {
          e.telegraph = 22;
        } else {
          e.x += Math.cos(a) * e.spd * 0.6;
          e.y += Math.sin(a) * e.spd * 0.6;
        }
      } else {
        e.x += Math.cos(a) * e.spd;
        e.y += Math.sin(a) * e.spd;
      }
      const hitR = e.kind === 'brute' ? 16 : 12;
      if (state.inv <= 0 && Math.hypot(e.x - state.p.x, e.y - state.p.y) < hitR) hurt();
    }

    for (const s of state.shots) {
      s.x += s.vx; s.y += s.vy;
      for (const e of state.enemies) {
        if (e.hp <= 0) continue;
        const r = e.kind === 'brute' ? 16 : 11;
        if (Math.hypot(s.x - e.x, s.y - e.y) < r) {
          e.hp--;
          if (s.pierce > 0) s.pierce--; else s.dead = true;
          if (e.hp <= 0) {
            state.kills++;
            state.score += e.kind === 'brute' ? 40 : 15;
            state.xp++;
            state.gems.push({ x: e.x, y: e.y, life: 240 });
            state.sparks.push({ x: e.x, y: e.y, life: 12, color: HOT });
            if (state.xp >= state.lvl * 8) {
              state.lvl++;
              state.xp = 0;
              state.msg = 'STILL RANK ' + state.lvl;
              state.msgT = 70;
              beep(660, 0.08); beep(880, 0.1);
            }
          }
        }
      }
    }
    state.shots = state.shots.filter(s => !s.dead && s.x > -20 && s.x < W + 20 && s.y > -20 && s.y < H + 20);
    state.enemies = state.enemies.filter(e => e.hp > 0);

    for (const g of state.gems) {
      g.life--;
      const pull = state.locked ? 4.2 : 1.4;
      const a = Math.atan2(state.p.y - g.y, state.p.x - g.x);
      const d = Math.hypot(state.p.x - g.x, state.p.y - g.y);
      if (d < 90 || state.locked) {
        g.x += Math.cos(a) * pull;
        g.y += Math.sin(a) * pull;
      }
      if (d < 14) {
        g.life = 0;
        state.score += 5;
        gemTick();
      }
    }
    state.gems = state.gems.filter(g => g.life > 0);
    state.sparks = state.sparks.filter(s => { s.life--; return s.life > 0; });
    if (state.shake > 0) state.shake--;
    if (state.flash > 0) state.flash--;
    if (state.msgT > 0) state.msgT--;
  }

  function draw() {
    ctx.save();
    if (state.shake) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,61,122,0.05)';
    for (let y = 0; y < H; y += 3) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    const mm = Math.max(0, Math.floor(state.left / 60));
    const ss = Math.max(0, Math.floor(state.left % 60));
    ctx.fillStyle = HOT;
    ctx.font = '16px Impact, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('STILL FIRE', 14, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = CHROME;
    ctx.fillText(mm + ':' + String(ss).padStart(2, '0') + '  ·  SCR ' + state.score + '  ·  HP ' + state.hp + '  ·  LV ' + state.lvl, W - 14, 24);

    if (state.phase !== 'title') {
      if (state.locked) {
        ctx.strokeStyle = MINT;
        ctx.globalAlpha = 0.35 + 0.2 * Math.sin(state.t * 0.2);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(state.p.x, state.p.y, 22 + (state.t % 16), 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        const pct = Math.min(1, state.still / 8);
        ctx.strokeStyle = AMBER;
        ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.arc(state.p.x, state.p.y, 18, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = state.locked ? MINT : CYAN;
      ctx.beginPath(); ctx.arc(state.p.x, state.p.y, 8, 0, Math.PI * 2); ctx.fill();
      if (state.inv > 0 && state.inv % 6 < 3) {
        ctx.strokeStyle = '#fff';
        ctx.beginPath(); ctx.arc(state.p.x, state.p.y, 12, 0, Math.PI * 2); ctx.stroke();
      }

      for (const e of state.enemies) {
        ctx.save();
        if (e.kind === 'dart' && e.telegraph > 0) {
          ctx.strokeStyle = '#fff';
          ctx.globalAlpha = 0.6;
          ctx.beginPath(); ctx.arc(e.x, e.y, 10 + (22 - e.telegraph), 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.strokeStyle = e.kind === 'brute' ? AMBER : HOT;
        ctx.lineWidth = 2;
        const r = e.kind === 'brute' ? 14 : 8;
        ctx.strokeRect(e.x - r, e.y - r, r * 2, r * 2);
        ctx.restore();
      }
      for (const s of state.shots) { ctx.fillStyle = MINT; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }
      for (const g of state.gems) { ctx.fillStyle = AMBER; ctx.fillRect(g.x - 3, g.y - 3, 6, 6); }
    }
    for (const s of state.sparks) { ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, 3, 3); }
    if (state.msgT > 0 && state.phase === 'play') {
      ctx.fillStyle = AMBER;
      ctx.font = '16px Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.msg, W / 2, 52);
    }
    if (state.flash) { ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  function frame(now) {
    acc += now - last; last = now;
    if (acc > 200) acc = 200;
    while (acc >= DT) { try { update(); } catch (e) { console.error(e); } acc -= DT; }
    try { draw(); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  try { canvas.focus(); } catch (_) {}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
