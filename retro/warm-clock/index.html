<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>WARM CLOCK</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;color:#c8d0e0;font-family:Impact,"Arial Narrow",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:8px;box-sizing:border-box}
  #tube{position:relative;width:min(960px,96vw,calc((100vh - 16px)*4/3));aspect-ratio:4/3;max-height:calc(100vh - 16px);background:#050508;box-shadow:0 0 0 8px #12141a,0 0 0 10px #2a2e38,inset 0 0 48px #000;overflow:hidden}
  #tube::after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 3px);mix-blend-mode:multiply}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,8,.82);text-align:center;gap:10px;padding:16px;z-index:3}
  #overlay h1{margin:0;color:#ffc14a;font-size:clamp(28px,6vw,44px);letter-spacing:.14em;text-shadow:0 0 18px rgba(255,193,74,.5)}
  #overlay p{margin:0;max-width:32em;line-height:1.4;color:#c8d0e0;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;font-weight:500}
  #overlay .go{color:#ff3d7a;font-size:18px;letter-spacing:.2em}
  .hidden{display:none!important}
  #pad{display:none;position:absolute;left:0;right:0;bottom:0;height:28%;z-index:4;pointer-events:none}
  body.touch #pad{display:block}
  #pad .stick{pointer-events:auto;position:absolute;left:4%;bottom:10%;width:38%;height:78%;border:1px solid #2a3a44;border-radius:12px;background:rgba(8,12,16,.45)}
  #pad .btns{pointer-events:auto;position:absolute;right:4%;bottom:14%;display:flex;gap:10px}
  #pad b{width:58px;height:58px;border-radius:50%;border:2px solid #3a4;background:#1c2420;color:#c8f4e8;display:grid;place-items:center;font:700 12px/1 ui-monospace,monospace}
  #pad b.on{background:#3df0c8;color:#041}
</style>
</head>
<body>
<div id="wrap">
  <div id="tube">
    <canvas id="c" width="640" height="480" tabindex="0" aria-label="Warm Clock playfield"></canvas>
    <div id="overlay">
      <h1>WARM CLOCK</h1>
      <p>You are the clock. The minute-hand is a sword. The hour-hand is a shield. Enemies hatch on hour marks you have not visited. Score is the last time on the face when you stop.</p>
      <p>← → sword · ↑ ↓ shield · drag aims the blade · Z / A dash-spin</p>
      <p id="hiLine"></p>
      <div class="go">INSERT COIN · PRESS START</div>
    </div>
    <div id="pad">
      <div class="stick" id="stick"></div>
      <div class="btns"><b data-act="spin">SPIN</b><b data-act="start">GO</b></div>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const W = 640, H = 480;
  const MINT = '#7dffb3', AMBER = '#ffc14a', HOT = '#ff3d7a', CHROME = '#c8d0e0', CYAN = '#5ec8ff';
  const CX = 320, CY = 262, FACE = 168;
  const SWORD = 158, SHIELD = 78;
  const HS = 'retro.warm-clock.hi';
  const DT = 1000 / 60;
  let acc = 0, last = performance.now();

  function isTouch() { return matchMedia('(pointer:coarse)').matches || innerWidth < 780; }
  document.body.classList.toggle('touch', isTouch());
  addEventListener('resize', () => document.body.classList.toggle('touch', isTouch()));

  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {}
  }
  function beep(f, d, t = 'square', g = 0.045) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = t; o.frequency.value = f;
      gn.gain.setValueAtTime(Math.max(0.0008, g), audioCtx.currentTime);
      gn.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + Math.max(0.02, d));
      o.connect(gn); gn.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + Math.max(0.02, d) + 0.02);
    } catch (_) {}
  }
  function slashTick() { beep(880, 0.03, 'square', 0.05); beep(1320, 0.04, 'triangle', 0.02); }
  function visitTick() { beep(523, 0.07); beep(784, 0.1); }
  function hourTick() { beep(330, 0.1); beep(440, 0.12); beep(660, 0.16); }
  function hitTick() { beep(90, 0.16, 'sawtooth', 0.07); beep(50, 0.2, 'square', 0.04); }
  function blockTick() { beep(240, 0.05, 'triangle', 0.04); }

  function loadHi() { return parseInt(localStorage.getItem(HS) || '0', 10) || 0; }
  function saveHi(v) {
    const h = loadHi();
    if (v > h) { localStorage.setItem(HS, String(v)); return v; }
    return h;
  }
  function fmt(m) {
    const hh = Math.floor(m / 60);
    const mm = m % 60;
    const h12 = (hh % 12) === 0 ? 12 : (hh % 12);
    return h12 + ':' + String(mm).padStart(2, '0');
  }
  document.getElementById('hiLine').textContent = 'HIGH ' + fmt(loadHi());

  const keys = {};
  const impulse = {};
  const pointer = { down: false, x: CX, y: CY, id: null };
  let stickAim = null;

  function onKey(e, down) {
    const c = e.code || '';
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','Enter','KeyA','KeyD','KeyW','KeyS'].includes(c)) e.preventDefault();
    if (down && !keys[c]) impulse[c] = true;
    keys[c] = down;
    if (!down) return;
    ensureAudio();
    if (c === 'Enter' || c === 'Space') {
      if (state.phase !== 'play' && canStart()) startGame();
    }
  }
  addEventListener('keydown', e => onKey(e, true), true);
  addEventListener('keyup', e => onKey(e, false), true);

  let holdUntil = 0;
  function canStart() { return performance.now() >= holdUntil; }

  function worldPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  }
  function pointerStart(ev) {
    ev.preventDefault();
    canvas.focus(); ensureAudio();
    if (state.phase !== 'play') { if (canStart()) startGame(); return; }
    const p = worldPos(ev);
    pointer.down = true; pointer.x = p.x; pointer.y = p.y; pointer.id = ev.pointerId;
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
  }
  canvas.addEventListener('pointerdown', pointerStart);
  overlay.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); if (canStart()) startGame(); });
  canvas.addEventListener('pointermove', ev => {
    if (!pointer.down) return;
    const p = worldPos(ev); pointer.x = p.x; pointer.y = p.y;
  });
  canvas.addEventListener('pointerup', () => { pointer.down = false; });
  canvas.addEventListener('pointercancel', () => { pointer.down = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const stick = document.getElementById('stick');
  stick.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ev.stopPropagation();
    try { stick.setPointerCapture(ev.pointerId); } catch (_) {}
    const r = stick.getBoundingClientRect();
    stickAim = { x: (ev.clientX - r.left) / r.width - 0.5, y: (ev.clientY - r.top) / r.height - 0.5 };
    ensureAudio();
    if (state.phase !== 'play' && canStart()) startGame();
  });
  stick.addEventListener('pointermove', ev => {
    if (stickAim == null) return;
    const r = stick.getBoundingClientRect();
    stickAim = { x: (ev.clientX - r.left) / r.width - 0.5, y: (ev.clientY - r.top) / r.height - 0.5 };
  });
  stick.addEventListener('pointerup', () => { stickAim = null; });
  document.querySelectorAll('#pad [data-act]').forEach(b => {
    const act = b.getAttribute('data-act');
    const down = ev => {
      ev.preventDefault(); b.classList.add('on'); ensureAudio();
      if (act === 'start' && state.phase !== 'play' && canStart()) startGame();
      if (act === 'spin') impulse.KeyZ = true;
    };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', () => b.classList.remove('on'));
    b.addEventListener('pointercancel', () => b.classList.remove('on'));
  });

  const state = {
    phase: 'title',
    sword: -Math.PI / 2,
    shield: Math.PI / 2,
    visited: Array(12).fill(false),
    ticks: [],
    shots: [],
    sparks: [],
    hp: 3,
    inv: 0,
    minutes: 0,
    hoursCleared: 0,
    t: 0,
    spawnT: 0,
    shake: 0,
    flash: 0,
    msg: '',
    msgT: 0,
    spin: 0
  };

  function markAng(i) { return -Math.PI / 2 + i * Math.PI / 6; }
  function markPos(i, r) {
    const a = markAng(i);
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r };
  }
  function angDiff(a, b) {
    let d = (a - b) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function covered(a) { return Math.abs(angDiff(state.shield, a)) < 0.52; }

  function startGame() {
    if (!canStart()) return;
    ensureAudio();
    state.phase = 'play';
    state.sword = -Math.PI / 2;
    state.shield = Math.PI / 2;
    state.visited = Array(12).fill(false);
    state.ticks = [];
    state.shots = [];
    state.sparks = [];
    state.hp = 3;
    state.inv = 150;
    state.minutes = 0;
    state.hoursCleared = 0;
    state.t = 0;
    state.spawnT = 90;
    state.shake = 0;
    state.flash = 0;
    state.spin = 0;
    state.msg = 'OPENING 20s — SWEEP THE UNLIT MARKS';
    state.msgT = 120;
    overlay.classList.add('hidden');
    try { canvas.focus(); } catch (_) {}
    beep(330, 0.08); beep(440, 0.1);
  }

  function die() {
    hitTick();
    const hi = saveHi(state.minutes);
    state.phase = 'dead';
    holdUntil = performance.now() + 900;
    overlay.classList.remove('hidden');
    overlay.innerHTML = `<h1>STOPPED</h1><p>The face read <b>${fmt(state.minutes)}</b> when the hub went dark.</p><p>High ${fmt(hi)}</p><div class="go">PRESS START</div>`;
  }

  function hurt(why) {
    if (state.inv > 0 || state.phase !== 'play') return;
    hitTick();
    state.hp--;
    state.inv = state.t < 20 * 60 ? 150 : 110;
    state.shake = 10;
    state.flash = 4;
    state.msg = why;
    state.msgT = 70;
    if (state.hp <= 0) die();
  }

  function visit(i) {
    if (state.visited[i]) return;
    state.visited[i] = true;
    state.minutes += 5;
    visitTick();
    const p = markPos(i, FACE);
    for (let n = 0; n < 10; n++) {
      state.sparks.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 16, color: AMBER });
    }
    state.ticks = state.ticks.filter(tk => tk.mark !== i);
    if (state.visited.every(Boolean)) {
      state.hoursCleared++;
      hourTick();
      state.visited = Array(12).fill(false);
      state.msg = 'HOUR ' + (state.hoursCleared + 12) + ' — MARKS RESET';
      state.msgT = 80;
      state.flash = 5;
    }
  }

  function spawnTick() {
    const open = [];
    for (let i = 0; i < 12; i++) if (!state.visited[i]) open.push(i);
    if (!open.length) return;
    const mark = open[(Math.random() * open.length) | 0];
    if (state.ticks.some(t => t.mark === mark && t.rad > FACE * 0.7)) return;
    state.ticks.push({ mark, rad: FACE + 8, hp: 1 + (state.hoursCleared > 2 ? 1 : 0), cool: 50 + ((Math.random() * 40) | 0) });
  }

  function update() {
    state.t++;
    if (state.phase !== 'play') {
      for (const k of Object.keys(impulse)) delete impulse[k];
      return;
    }
    if (keys.ArrowLeft || keys.KeyA) state.sword -= 0.09;
    if (keys.ArrowRight || keys.KeyD) state.sword += 0.09;
    if (keys.ArrowUp || keys.KeyW) state.shield -= 0.06;
    if (keys.ArrowDown || keys.KeyS) state.shield += 0.06;
    if (impulse.KeyZ || impulse.KeyX) {
      state.spin = 10;
      slashTick();
    }
    if (state.spin > 0) {
      state.sword += 0.42;
      state.spin--;
    }
    if (pointer.down) {
      state.sword = Math.atan2(pointer.y - CY, pointer.x - CX);
    }
    if (stickAim && (stickAim.x * stickAim.x + stickAim.y * stickAim.y) > 0.02) {
      state.sword = Math.atan2(stickAim.y, stickAim.x);
    }
    if (state.inv > 0) state.inv--;

    const tip = { x: CX + Math.cos(state.sword) * SWORD, y: CY + Math.sin(state.sword) * SWORD };
    for (let i = 0; i < 12; i++) {
      const p = markPos(i, FACE);
      if (Math.hypot(tip.x - p.x, tip.y - p.y) < 26) visit(i);
    }

    const grace = state.t < 20 * 60;
    const crawl = grace ? 0.16 : (0.42 + state.hoursCleared * 0.1);
    for (const tk of state.ticks) {
      tk.rad -= crawl;
      const a = markAng(tk.mark);
      const x = CX + Math.cos(a) * tk.rad;
      const y = CY + Math.sin(a) * tk.rad;
      if (Math.hypot(tip.x - x, tip.y - y) < 16) {
        tk.hp--;
        slashTick();
        state.sparks.push({ x, y, vx: Math.cos(state.sword) * 3, vy: Math.sin(state.sword) * 3, life: 12, color: MINT });
      }
      tk.cool--;
      if (!grace && tk.cool <= 0 && tk.rad > 50) {
        tk.cool = 70 - Math.min(40, state.hoursCleared * 8);
        const sp = 1.6 + state.hoursCleared * 0.15;
        state.shots.push({ x, y, vx: -Math.cos(a) * sp, vy: -Math.sin(a) * sp, a });
      } else if (grace && tk.cool < 8) {
        tk.cool = 24;
      }
      if (tk.rad < 28) {
        if (covered(a)) {
          blockTick();
          tk.rad = FACE * 0.55;
        } else {
          hurt('A tick reached the hub — unvisited mark.');
          tk.rad = FACE;
        }
      }
    }
    state.ticks = state.ticks.filter(tk => tk.hp > 0);

    for (const s of state.shots) {
      s.x += s.vx; s.y += s.vy;
      const da = Math.atan2(s.y - CY, s.x - CX);
      const dist = Math.hypot(s.x - CX, s.y - CY);
      if (dist < SHIELD + 8 && covered(da)) {
        s.dead = true;
        blockTick();
        state.sparks.push({ x: s.x, y: s.y, vx: -s.vx, vy: -s.vy, life: 10, color: CYAN });
      } else if (dist < 18) {
        s.dead = true;
        hurt('Shot through the open arc.');
      }
      if (Math.hypot(tip.x - s.x, tip.y - s.y) < 12) s.dead = true;
    }
    state.shots = state.shots.filter(s => !s.dead && s.x > -20 && s.x < W + 20 && s.y > -20 && s.y < H + 20);

    state.spawnT--;
    if (state.spawnT <= 0) {
      const cap = grace ? 2 : 6;
      if (state.ticks.length < cap) spawnTick();
      state.spawnT = grace ? 110 : Math.max(20, 48 - state.hoursCleared * 6);
    }

    state.sparks = state.sparks.filter(p => { p.x += p.vx; p.y += p.vy; p.life--; return p.life > 0; });
    if (state.shake > 0) state.shake--;
    if (state.flash > 0) state.flash--;
    if (state.msgT > 0) state.msgT--;
    for (const k of Object.keys(impulse)) delete impulse[k];
  }

  function drawFace() {
    ctx.strokeStyle = 'rgba(255,193,74,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX, CY, FACE + 18, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = AMBER;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, FACE, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,193,74,0.04)';
    ctx.beginPath(); ctx.arc(CX, CY, FACE - 2, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 12; i++) {
      const a = markAng(i);
      const inner = FACE - (i % 3 === 0 ? 18 : 10);
      ctx.strokeStyle = state.visited[i] ? MINT : HOT;
      ctx.lineWidth = i % 3 === 0 ? 3 : 2;
      ctx.globalAlpha = state.visited[i] ? 0.55 : (0.75 + 0.25 * Math.sin(state.t * 0.15 + i));
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a) * inner, CY + Math.sin(a) * inner);
      ctx.lineTo(CX + Math.cos(a) * FACE, CY + Math.sin(a) * FACE);
      ctx.stroke();
      const p = markPos(i, FACE + 28);
      ctx.globalAlpha = 1;
      ctx.fillStyle = state.visited[i] ? MINT : CHROME;
      ctx.font = (i % 3 === 0 ? '18px' : '13px') + ' Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(i === 0 ? 12 : i), p.x, p.y);
    }
  }

  function drawHands() {
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(state.shield);
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(SHIELD, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(94,200,255,0.25)';
    ctx.lineWidth = 36;
    ctx.beginPath(); ctx.arc(0, 0, SHIELD * 0.55, -0.5, 0.5); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(state.sword);
    ctx.shadowColor = AMBER;
    ctx.shadowBlur = 10;
    ctx.fillStyle = AMBER;
    ctx.beginPath();
    ctx.moveTo(SWORD, 0);
    ctx.lineTo(SWORD - 22, 6);
    ctx.lineTo(-18, 3);
    ctx.lineTo(-18, -3);
    ctx.lineTo(SWORD - 22, -6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = HOT;
    ctx.beginPath();
    ctx.moveTo(SWORD, 0);
    ctx.lineTo(SWORD - 16, 4);
    ctx.lineTo(SWORD - 16, -4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = AMBER;
    ctx.beginPath(); ctx.arc(CX, CY, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#050508';
    ctx.beginPath(); ctx.arc(CX, CY, 4, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    ctx.save();
    if (state.shake > 0) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,193,74,0.04)';
    for (let y = 0; y < H; y += 3) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    ctx.fillStyle = AMBER;
    ctx.font = '16px Impact, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('WARM CLOCK', 14, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = CHROME;
    ctx.fillText(fmt(state.minutes) + (state.phase === 'play' && state.t < 20 * 60 ? '  ·  OPENING' : '') + '  ·  HP ' + state.hp + '  ·  HI ' + fmt(loadHi()), W - 14, 24);

    if (state.phase !== 'title') {
      drawFace();
      for (const tk of state.ticks) {
        const a = markAng(tk.mark);
        const x = CX + Math.cos(a) * tk.rad;
        const y = CY + Math.sin(a) * tk.rad;
        ctx.strokeStyle = HOT;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y - 8); ctx.lineTo(x + 7, y + 6); ctx.lineTo(x - 7, y + 6); ctx.closePath();
        ctx.stroke();
      }
      for (const s of state.shots) {
        ctx.fillStyle = HOT;
        ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
      }
      drawHands();
      if (state.inv > 0 && state.inv % 6 < 3) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(CX, CY, 22, 0, Math.PI * 2); ctx.stroke();
      }
    }

    for (const p of state.sparks) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    if (state.msgT > 0 && state.phase === 'play') {
      ctx.fillStyle = 'rgba(5,5,8,0.78)';
      ctx.fillRect(80, 40, W - 160, 36);
      ctx.strokeStyle = AMBER;
      ctx.strokeRect(80.5, 40.5, W - 161, 35);
      ctx.fillStyle = AMBER;
      ctx.font = '16px Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.msg, W / 2, 64);
    }
    if (state.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function frame(now) {
    acc += now - last; last = now;
    if (acc > 200) acc = 200;
    while (acc >= DT) { try { update(); } catch (e) { console.error(e); } acc -= DT; }
    try { draw(); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  try { canvas.focus(); } catch (_) {}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
